; Lucy MacLean (Vault 33 — Fallout TV Series)
; 100% Local AI Companion (Ollama + Synchronous Kokoro-ONNX Voice + HUD Subtitles)
[companion]
name = Lucy
full_name = Lucy MacLean (Vault 33)
language = en-us
; Default local Ollama model (qwen2.5:3b uses only ~1.9 GB VRAM so it never pages to RAM while Fallout 4 is running)
ollama_model = qwen2.5:3b
; Minimum seconds between unprompted remarks during quiet exploration (heartbeat)
comment_cooldown_s = 45
; Enables weighted rotation of Lucy's 10 line styles (Vault 33 rules, TV callbacks, Golden Rule, Fallout lore...)
variety_mode = yes
; Local voice synthesis via Kokoro-ONNX (yes = synchronous clause streaming; no = HUD subtitles only)
voice_enabled = yes
; Voice options: af_bella (default), af_heart, af_sarah, af_nicole, af_sky, or lucy_blend
kokoro_voice = af_bella
voice_volume = 0.80
