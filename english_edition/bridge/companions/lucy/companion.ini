; Lucy MacLean (Vault 33 — Fallout TV Series)
; 100% Local AI Companion (Ollama or KoboldCpp + Synchronous Kokoro-ONNX or KoboldCpp audio.cpp Voice + HUD Subtitles)
[companion]
name = Lucy
full_name = Lucy MacLean (Vault 33)
language = en-us
; LLM backend: auto (tries Ollama on :11434, falls back to KoboldCpp on :5001), ollama, or koboldcpp
llm_backend = auto
; Default local Ollama model (qwen2.5:3b uses only ~1.9 GB VRAM so it never pages to RAM while Fallout 4 is running)
ollama_model = qwen2.5:3b
; KoboldCpp unified API URL (used when llm_backend or tts_backend is set to koboldcpp or auto-detected)
koboldcpp_url = http://127.0.0.1:5001
; Minimum seconds between unprompted remarks during quiet exploration (heartbeat)
comment_cooldown_s = 45
; Enables weighted rotation of Lucy's 10 line styles (Vault 33 rules, TV callbacks, Golden Rule, Fallout lore...)
variety_mode = yes
; Local voice synthesis (yes = synchronous clause streaming; no = HUD subtitles only)
voice_enabled = yes
; TTS backend: auto (uses local Kokoro-ONNX if present, else KoboldCpp audio.cpp TTS on :5001), kokoro_onnx, or koboldcpp
tts_backend = auto
; Voice options: af_bella (default), af_heart, af_sarah, af_nicole, af_sky, or lucy_blend
kokoro_voice = af_bella
voice_volume = 0.80
