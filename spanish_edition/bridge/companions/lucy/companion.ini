; Lucy MacLean (Refugio 33 — Serie de TV Fallout)
; Compañera IA 100% Local — EDICIÓN EN ESPAÑOL (Ollama o KoboldCpp + Voz Kokoro-ONNX o KoboldCpp audio.cpp + Subtítulos HUD)
[companion]
name = Lucy
full_name = Lucy MacLean (Refugio 33)
language = es
; Motor LLM: auto (prueba Ollama en :11434 y si no está activo usa KoboldCpp en :5001), ollama, o koboldcpp
llm_backend = auto
; Modelo local en Ollama (ejecutado en P-Cores de CPU con num_gpu=0 para cero bloqueo de GPU en Fallout 4)
ollama_model = qwen2.5:3b
; URL de la API unificada de KoboldCpp (usada cuando llm_backend o tts_backend es koboldcpp o auto)
koboldcpp_url = http://127.0.0.1:5001
; Segundos mínimos entre comentarios espontáneos de exploración (heartbeat)
comment_cooldown_s = 45
; Activa la rotación ponderada de los 10 estilos de línea de Lucy
variety_mode = yes
; Síntesis de voz local (yes = streaming por cláusulas; no = solo subtítulos HUD)
voice_enabled = yes
; Motor TTS: auto (usa Kokoro-ONNX local si está disponible, o KoboldCpp audio.cpp en :5001), kokoro_onnx, o koboldcpp
tts_backend = auto
kokoro_voice = ef_dora
voice_volume = 0.85
